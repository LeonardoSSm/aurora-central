name: Verificação desktop

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verificar (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências nativas do Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Preparar Rust estável
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: cargo +stable fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Compilar desktop Linux
        if: runner.os == 'Linux'
        run: npm run tauri build -- --no-bundle -- --locked
        env:
          RUSTUP_TOOLCHAIN: stable
      - name: Gerar instalador Windows x64
        if: runner.os == 'Windows'
        run: npm run tauri build -- --bundles nsis --no-binary-patching -- --locked
        env:
          RUSTUP_TOOLCHAIN: stable
      - run: cargo +stable test --manifest-path src-tauri/Cargo.toml --release --locked --features tauri/custom-protocol
      - name: Verificar o instalador Windows e calcular SHA-256
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis -File -Filter '*_x64-setup.exe')
          if ($installers.Count -ne 1) { throw 'Esperado um único instalador NSIS x64.' }
          $installer = $installers[0]
          ./scripts/test-windows-installer.ps1 -InstallerPath $installer.FullName -BinaryPath src-tauri/target/release/aurora-central.exe
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -LiteralPath "$($installer.DirectoryName)/SHA256SUMS.txt" -Encoding ascii
      - name: Guardar instalador para revisão
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: aurora-central-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*_x64-setup.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
